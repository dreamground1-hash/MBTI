```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Arial", "Malgun Gothic", sans-serif;
      background: #fff8e8;
      color: #29483a;
      min-height: 100vh;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 50px 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      color: #356b4d;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 35px;
      color: #6c806f;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }

    .mbti-btn {
      border: 3px solid #b8d8bd;
      background: #f4faef;
      color: #356b4d;
      border-radius: 18px;
      padding: 18px 8px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .mbti-btn:hover {
      background: #dcefdc;
      transform: translateY(-3px);
    }

    .result {
      display: none;
      background: #fffdf5;
      border: 3px solid #b8d8bd;
      border-radius: 30px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(67, 100, 70, 0.12);
      animation: appear 0.35s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .selected-mbti {
      display: inline-block;
      background: #dcefdc;
      color: #356b4d;
      border-radius: 50px;
      padding: 8px 18px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .pokemon-emoji {
      font-size: 7rem;
      line-height: 1.1;
      margin: 10px 0;
    }

    .pokemon-name {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 5px 0 20px;
      color: #356b4d;
    }

    .reason {
      max-width: 650px;
      margin: 0 auto 25px;
      font-size: 1.2rem;
      line-height: 1.8;
      color: #52675a;
    }

    .compatibility {
      display: inline-block;
      background: #fff0c9;
      border-radius: 18px;
      padding: 15px 25px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #765d28;
      margin-bottom: 25px;
    }

    .reset-btn {
      display: block;
      margin: 10px auto 0;
      border: none;
      border-radius: 16px;
      padding: 15px 30px;
      background: #5b8f68;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #467653;
    }

    @media (max-width: 650px) {
      .container {
        padding: 35px 0;
      }

      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .mbti-btn {
        padding: 16px 5px;
        font-size: 1.1rem;
      }

      .pokemon-emoji {
        font-size: 5.5rem;
      }

      .reason {
        font-size: 1.05rem;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🌿 MBTI로 포켓몬 찾기</h1>
    <p class="subtitle">나와 가장 잘 어울리는 포켓몬은 누구일까?</p>

    <section id="selection">
      <div class="mbti-grid">
        <button class="mbti-btn" onclick="showPokemon('ISTJ')">ISTJ</button>
        <button class="mbti-btn" onclick="showPokemon('ISFJ')">ISFJ</button>
        <button class="mbti-btn" onclick="showPokemon('INFJ')">INFJ</button>
        <button class="mbti-btn" onclick="showPokemon('INTJ')">INTJ</button>

        <button class="mbti-btn" onclick="showPokemon('ISTP')">ISTP</button>
        <button class="mbti-btn" onclick="showPokemon('ISFP')">ISFP</button>
        <button class="mbti-btn" onclick="showPokemon('INFP')">INFP</button>
        <button class="mbti-btn" onclick="showPokemon('INTP')">INTP</button>

        <button class="mbti-btn" onclick="showPokemon('ESTP')">ESTP</button>
        <button class="mbti-btn" onclick="showPokemon('ESFP')">ESFP</button>
        <button class="mbti-btn" onclick="showPokemon('ENFP')">ENFP</button>
        <button class="mbti-btn" onclick="showPokemon('ENTP')">ENTP</button>

        <button class="mbti-btn" onclick="showPokemon('ESTJ')">ESTJ</button>
        <button class="mbti-btn" onclick="showPokemon('ESFJ')">ESFJ</button>
        <button class="mbti-btn" onclick="showPokemon('ENFJ')">ENFJ</button>
        <button class="mbti-btn" onclick="showPokemon('ENTJ')">ENTJ</button>
      </div>
    </section>

    <section id="result" class="result">
      <div id="selectedMbti" class="selected-mbti"></div>

      <div id="pokemonEmoji" class="pokemon-emoji"></div>

      <h2 id="pokemonName" class="pokemon-name"></h2>

      <p id="reason" class="reason"></p>

      <div id="compatibility" class="compatibility"></div>

      <button class="reset-btn" onclick="resetChoice()">↩ 다시 고르기</button>
    </section>

  </main>

  <script>
    const pokemonData = {
      ISTJ: {
        pokemon: "거북왕",
        emoji: "🐢",
        reason: "책임감이 강하고 계획적으로 움직이는 ISTJ에게 든든한 거북왕이 잘 어울려요.<br>차분하게 자신의 역할을 해내는 모습이 닮았답니다.",
        match: "ISFJ"
      },

        match: "ESFJ"
      },

      INFJ: {
        pokemon: "가디안",
        emoji: "🧚",
        reason: "깊은 생각과 따뜻한 마음을 가진 INFJ에게 가디안이 잘 어울려요.<br>소중한 사람을 지켜주고 조용히 힘이 되어주는 모습이 닮았답니다.",
        match: "ENFP"
      },

      INTJ: {
        pokemon: "메타그로스",
        emoji: "🤖",
        reason: "논리적으로 생각하고 목표를 향해 나아가는 INTJ와 메타그로스는 닮은 점이 많아요.<br>똑똑하고 냉철하게 문제를 해결하는 모습이 매력적이에요.",
        match: "ENTP"
      },

      ISTP: {
        pokemon: "루카리오",
        emoji: "🐺",
        reason: "혼자서도 척척 해내고 실전 감각이 뛰어난 ISTP에게 루카리오가 어울려요.<br>필요한 순간 빠르게 행동하는 멋진 모습이 닮았어요.",
        match: "ESTP"
      },

      ISFP: {
        pokemon: "이브이",
        emoji: "🦊",
        reason: "자유롭고 부드러운 매력을 가진 ISFP에게 이브이가 잘 어울려요.<br>자신만의 방식으로 세상을 즐기는 모습이 사랑스러워요.",
        match: "ESFP"
      },

      INFP: {
        pokemon: "쉐이미",
        emoji: "🌸",
        reason: "감성이 풍부하고 순수한 마음을 가진 INFP에게 쉐이미가 딱이에요.<br>작지만 소중한 것들을 사랑하고 평화를 좋아하는 모습이 닮았답니다.",

      },

      INTP: {
        pokemon: "프리져",
        emoji: "❄️",

        match: "ENTJ"
      },

      ESTP: {
        pokemon: "리자몽",
        emoji: "🔥",
        reason: "행동력이 뛰어나고 모험을 좋아하는 ESTP에게 리자몽이 잘 어울려요.<br>겁내지 않고 직접 부딪히는 화끈한 에너지가 닮았어요.",
        match: "ISTP"
      },

      ESFP: {
        pokemon: "피카츄",
        emoji: "⚡",
        reason: "밝고 활발하며 사람들과 함께하는 것을 좋아하는 ESFP에게 피카츄가 딱이에요.<br>어디서든 분위기를 즐겁게 만드는 매력이 닮았답니다.",
        match: "ISFP"
      },

      ENFP: {
        pokemon: "파치리스",
        emoji: "🐿️",
        reason: "호기심 많고 에너지가 넘치는 ENFP에게 파치리스가 잘 어울려요.<br>새로운 것을 좋아하고 주변에 즐거운 에너지를 전하는 모습이 닮았어요.",
        match: "INFJ"
      },

      ENTP: {
        pokemon: "후딘",
        emoji: "🥄",
        reason: "아이디어가 많고 토론을 즐기는 ENTP에게 후딘이 잘 어울려요.<br>빠르게 생각하고 색다른 방법을 찾아내는 모습이 매력적이에요.",
        match: "INTJ"
      },

      ESTJ: {
        pokemon: "괴력몬",
        emoji: "💪",
        reason: "목표를 정하면 확실하게 실행하는 ESTJ에게 괴력몬이 잘 어울려요.<br>강한 추진력과 책임감으로 일을 끝까지 해내는 모습이 닮았어요.",
        match: "ISTJ"
      },

      ESFJ: {
        pokemon: "가디",
        emoji: "🐕",
        reason: "사람을 좋아하고 주변을 따뜻하게 챙기는 ESFJ에게 가디가 잘 어울려요.<br>충성심이 강하고 소중한 사람을 지켜주는 모습이 닮았답니다.",
        match: "ISFJ"
      },

      ENFJ: {
        pokemon: "루카리오",
        emoji: "🐺",

        match: "INFP"
      },

      ENTJ: {
        pokemon: "보만다",
        emoji: "🐉",
        reason: "큰 목표를 세우고 자신 있게 추진하는 ENTJ에게 보만다가 잘 어울려요.<br>강한 리더십과 넘치는 자신감으로 앞으로 나아가는 모습이 닮았답니다.",
        match: "INTP"
      }
    };

    function showPokemon(type) {
      const data = pokemonData[type];

      document.getElementById("selection").style.display = "none";
      document.getElementById("result").style.display = "block";

      document.getElementById("selectedMbti").textContent =
        "나의 MBTI · " + type;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonName").textContent =
        data.pokemon;

      document.getElementById("reason").innerHTML =
        data.reason;

      document.getElementById("compatibility").textContent =
        "💚 잘 맞는 유형 · " + data.match;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function resetChoice() {
      document.getElementById("result").style.display = "none";
      document.getElementById("selection").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }
  </script>

</body>
</html>
